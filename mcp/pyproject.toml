[project]
name = "armorpaint-mcp"
version = "0.1.0"
description = "MCP control of a running ArmorPaint instance"
requires-python = ">=3.10"
dependencies = ["mcp>=1.30,<2"]

[project.scripts]
armorpaint-mcp = "armorpaint_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/armorpaint_mcp"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
